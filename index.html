<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Sorgt dafür, dass die Seite auf Handys richtig skaliert wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTB</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/sudoku.css">
  <link rel="stylesheet" href="css/sudoku-rpg.css">
  <link rel="stylesheet" href="css/sudoku-damage-fx.css">
  <!-- Smartphone-Aufbau des Sudokus: zuletzt, überstimmt die Handy-Regeln oben -->
  <link rel="stylesheet" href="css/sudoku-mobil.css">
  <link rel="stylesheet" href="css/football.css">
  <link rel="stylesheet" href="css/climb.css">
  <link rel="stylesheet" href="css/words.css">
  <link rel="stylesheet" href="css/media.css">
  <link rel="stylesheet" href="css/todo.css">
  <link rel="stylesheet" href="css/prompts.css">

  <!--
    Kleines Skript direkt im <head>:
    Es setzt das Farbschema (hell/dunkel), BEVOR die Seite gezeichnet wird.
    Stünde es erst in app.js, würde die Seite beim Laden kurz hell
    aufblitzen, obwohl Dark Mode gewählt ist.
  -->
  <script>
    (function () {
      var gespeichert = null;
      try {
        gespeichert = localStorage.getItem("hub-theme");
      } catch (fehler) {
        // localStorage kann gesperrt sein (z. B. im privaten Modus) – dann ignorieren
      }
      // Ohne eigene Wahl: dunkles Design (Standard)
      var theme = gespeichert === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      // Film-Effekte ausgeschaltet? (js/filmeffekte.js)
      try {
        if (localStorage.getItem("ntb-filmeffekte") === "aus") {
          document.documentElement.classList.add("ohne-film");
        }
      } catch (fehler) {
        // ignorieren
      }
    })();
  </script>
</head>
<body>

  <!--
    Navigationsleiste oben. Sie bleibt beim Scrollen stehen (sticky).
    Computer: NTB links, die Reiter in gleichen Abständen daneben,
              der Dark-Mode-Schalter ganz rechts.
    Handy:    NTB links, Hamburger und Dark-Mode-Schalter rechts –
              die Reiter klappen als Panel unter der Leiste aus.
  -->
  <header class="leiste">
    <nav class="leiste__nav" aria-label="Hauptnavigation">

      <!-- NTB führt zur Startseite -->
      <a class="reiter marke" href="#home" data-view="home">NTB</a>

      <!-- Hamburger-Button: nur auf kleinen Bildschirmen sichtbar -->
      <button class="icon-button hamburger" id="menu-button" type="button"
              aria-label="Menü öffnen" aria-controls="nav-panel" aria-expanded="false">
        <span class="hamburger__strich"></span>
        <span class="hamburger__strich"></span>
        <span class="hamburger__strich"></span>
      </button>

      <!--
        Das Panel enthält alle Reiter.
        Computer: eine Zeile zwischen NTB und dem Schalter.
        Handy:    schlichtes Panel, das unter der Leiste ausklappt.
        data-view verbindet den Link mit der passenden Ansicht im <main>.
      -->
      <div class="nav-panel" id="nav-panel">
        <ul class="reiter-gruppe">
          <li><a class="reiter" href="#kalender" data-view="kalender">Kalender</a></li>
          <li><a class="reiter" href="#schedule" data-view="schedule">Stundenplan/Termine</a></li>
          <li><a class="reiter" href="#todo" data-view="todo">Zu erledigen</a></li>
          <li><a class="reiter" href="#media" data-view="media">Filme/Serien</a></li>
          <li><a class="reiter" href="#games" data-view="games">Games</a></li>
          <li><a class="reiter" href="#prompts" data-view="prompts">Prompts</a></li>
          <li><a class="reiter" href="#einstellungen" data-view="einstellungen">Einstellungen</a></li>
        </ul>
      </div>

      <!-- Dark-Mode-Schalter ganz rechts -->
      <button class="icon-button theme-schalter" id="theme-button" type="button"
              aria-label="Dunkles Design" aria-pressed="false">
        <!-- Das Symbol wird von app.js gesetzt (☾ oder ☀) -->
        <span id="theme-symbol" aria-hidden="true">☾</span>
      </button>

    </nav>
  </header>

  <!-- Hauptbereich: hier liegen alle Ansichten. Nur eine ist sichtbar,
       die anderen haben das Attribut "hidden". -->
  <main class="hauptbereich" id="main">

    <section class="ansicht" id="view-home" aria-labelledby="titel-home">
      <!-- Die Begrüßung ("Guten Morgen" …) setzt home.js – sichtbar ist auf
           der Startseite nur der kleine Zeitstempel, die Überschrift gilt
           für Screenreader -->
      <h1 id="titel-home" class="nur-screenreader" tabindex="-1">Willkommen bei NTB</h1>
      <!-- home.js füllt diesen Container: Zeitstempel, Bento-Kacheln und Schnellzugriffe -->
      <div id="home-root"></div>
    </section>

    <section class="ansicht" id="view-kalender" aria-labelledby="titel-kalender" hidden>
      <h1 id="titel-kalender" tabindex="-1">Kalender</h1>
      <!-- calendar.js füllt diesen Container mit der Jahresübersicht -->
      <div id="calendar-root"></div>
    </section>

    <section class="ansicht" id="view-games" aria-labelledby="titel-games" hidden>
      <h1 id="titel-games" tabindex="-1">Games</h1>
      <!-- games.js füllt diesen Container mit der Spiele-Übersicht -->
      <div id="games-root"></div>
    </section>

    <section class="ansicht" id="view-media" aria-labelledby="titel-media" hidden>
      <h1 id="titel-media" tabindex="-1">Filme/Serien</h1>
      <!-- media.js füllt diesen Container (Übersicht und Kategorien) -->
      <div id="media-root"></div>
    </section>

    <section class="ansicht" id="view-schedule" aria-labelledby="titel-schedule" hidden>
      <h1 id="titel-schedule" tabindex="-1">Stundenplan/Termine</h1>
      <!-- schedule.js füllt diesen Container mit der Wochenansicht -->
      <div id="schedule-root"></div>
    </section>

    <section class="ansicht" id="view-todo" aria-labelledby="titel-todo" hidden>
      <h1 id="titel-todo" tabindex="-1">Zu erledigen</h1>
      <!-- todo.js füllt diesen Container mit Skala, Aufgaben und "Erledigt" -->
      <div id="todo-root"></div>
    </section>

    <section class="ansicht" id="view-einstellungen" aria-labelledby="titel-einstellungen" hidden>
      <h1 id="titel-einstellungen" tabindex="-1">Einstellungen</h1>
      <!-- settings.js füllt diesen Container (u. a. Sicherung aller Daten) -->
      <div id="settings-root"></div>
    </section>

    <section class="ansicht" id="view-prompts" aria-labelledby="titel-prompts" hidden>
      <h1 id="titel-prompts" tabindex="-1">Prompts</h1>
      <!-- prompts.js füllt diesen Container mit den Kacheln (Daten: js/prompts-data.js) -->
      <div id="prompts-root"></div>
    </section>

  </main>

  <!--
    Die Skripte stehen am Ende des <body>, damit das HTML schon geladen ist,
    wenn sie laufen. Reihenfolge: zuerst die Tools, zuletzt app.js,
    weil app.js die init-Funktionen der Tools aufruft.
    Bewusst KEIN type="module": Module funktionieren nicht, wenn man
    index.html per Doppelklick (file://) öffnet.
  -->
  <!-- Termine: der Store zuerst – Kalender und Stundenplan lesen beide daraus -->
  <script src="js/events-store.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/schedule.js"></script>
  <!-- Zu erledigen: Datenbank-Verbindung, Store, dann die Ansicht -->
  <script src="js/todo-db.js"></script>
  <script src="js/todo-store.js"></script>
  <script src="js/todo.js"></script>
  <!-- Sudoku: erst die Logik, dann die Effekte, dann die Oberfläche,
       dann die Games-Übersicht, die das Sudoku startet -->
  <script src="js/sudoku-engine.js"></script>
  <script src="js/sudoku-effects.js"></script>
  <!-- Sudoku-Abenteuer: Regeln, Pixel-Figuren, Schadensaufbau, Kampffenster -->
  <script src="js/worlds/welt1.js"></script>
  <script src="js/worlds/welt2.js"></script>
  <script src="js/worlds/welt3.js"></script>
  <script src="js/worlds/welt4.js"></script>
  <script src="js/sudoku-rpg.js"></script>
  <script src="js/sudoku-sprites.js"></script>
  <script src="js/sudoku-damage-fx.js"></script>
  <script src="js/dice3d.js"></script>
  <script src="js/sudoku-battle-ui.js"></script>
  <script src="js/sudoku-ui.js"></script>
  <!-- Fußball-Duell: Werte, Figuren, Arena, Kader, Fähigkeiten, Regeln, Sprites, Szene, Oberfläche -->
  <script src="js/football/konfig.js"></script>
  <script src="js/football/figuren.js"></script>
  <script src="js/football/arenen.js"></script>
  <script src="js/football/players.js"></script>
  <script src="js/football/abilities.js"></script>
  <script src="js/football/regeln.js"></script>
  <script src="js/football/sprites.js"></script>
  <script src="js/football/szene.js"></script>
  <script src="js/football/darstellung.js"></script>
  <!-- Kletterspiel: Werte, Zonen, Regeln, Rekord, Eingabe, Pixelbilder, Oberfläche -->
  <script src="js/climb/konfig.js"></script>
  <script src="js/climb/zonen.js"></script>
  <script src="js/climb/keyboard.js"></script>
  <script src="js/climb/regeln.js"></script>
  <script src="js/climb/speicher.js"></script>
  <script src="js/climb/eingabe.js"></script>
  <script src="js/climb/sprites.js"></script>
  <script src="js/climb/darstellung.js"></script>
  <!-- Worträtsel: Werte, Regeln, Spielstand, Oberfläche. Die Wortlisten
       (js/words/*-solutions.js, *-allowed.js) lädt das Spiel erst beim Öffnen. -->
  <script src="js/words/konfig.js"></script>
  <script src="js/words/regeln.js"></script>
  <script src="js/words/speicher.js"></script>
  <script src="js/words/darstellung.js"></script>
  <script src="js/games.js"></script>
  <!-- Filme/Serien: erst die Speicherung, dann die Darstellung -->
  <script src="js/media-store.js"></script>
  <script src="js/media.js"></script>
  <!-- Einstellungen: braucht MediaStore und EventsStore (für die Sicherung) -->
  <script src="js/settings.js"></script>
  <!-- Startseite: liest aus allen Stores, deshalb zuletzt vor app.js -->
  <script src="js/home.js"></script>
  <!-- Prompts: erst der Baum mit allen Kacheln und Texten, dann die Ansicht -->
  <script src="js/prompts-data.js"></script>
  <script src="js/prompts.js"></script>
  <!-- Filmkorn, Staub, Kratzer, Flackern und Vignette als eigene Ebene -->
  <script src="js/filmeffekte.js"></script>
  <!-- Übergänge zwischen den Ansichten (Schnitt ins Schwarze), vor app.js -->
  <script src="js/seitenwechsel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
