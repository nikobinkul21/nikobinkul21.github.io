<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Sorgt dafür, dass die Seite auf Handys richtig skaliert wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTB</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/sudoku.css">
  <link rel="stylesheet" href="css/sudoku-rpg.css">
  <link rel="stylesheet" href="css/sudoku-damage-fx.css">
  <link rel="stylesheet" href="css/media.css">

  <!--
    Kleines Skript direkt im <head>:
    Es setzt das Farbschema (hell/dunkel), BEVOR die Seite gezeichnet wird.
    Stünde es erst in app.js, würde die Seite beim Laden kurz hell
    aufblitzen, obwohl Dark Mode gewählt ist.
  -->
  <script>
    (function () {
      var gespeichert = null;
      try {
        gespeichert = localStorage.getItem("hub-theme");
      } catch (fehler) {
        // localStorage kann gesperrt sein (z. B. im privaten Modus) – dann ignorieren
      }
      var systemDunkel = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = gespeichert || (systemDunkel ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>

  <!-- Navigationsleiste oben. Sie bleibt beim Scrollen stehen (sticky). -->
  <header class="leiste">
    <nav class="leiste__nav" aria-label="Hauptnavigation">

      <!-- Hamburger-Button: nur auf kleinen Bildschirmen sichtbar -->
      <button class="icon-button hamburger" id="menu-button" type="button"
              aria-label="Menü öffnen" aria-controls="nav-panel" aria-expanded="false">
        <span class="hamburger__strich"></span>
        <span class="hamburger__strich"></span>
        <span class="hamburger__strich"></span>
      </button>

      <!--
        NTB gibt es zweimal im HTML, weil es auf Handy und Computer an
        unterschiedlichen Stellen steht:
          - marke--mobil:   in der Leiste, nur auf dem Handy sichtbar
          - marke--desktop: zwischen den Reitern, nur auf dem Computer sichtbar
        Per CSS ist immer genau eins davon mit display: none ausgeblendet.
        So stimmt die Tab-Reihenfolge immer mit der sichtbaren Reihenfolge überein.
      -->
      <a class="reiter marke marke--mobil" href="#home" data-view="home">NTB</a>

      <!--
        Das Panel enthält alle Reiter.
        Computer: Das Panel ist "unsichtbar" (display: contents), die Reiter
                  sitzen links und rechts von NTB direkt in der Leiste.
        Handy:    Das Panel klappt als Glas-Kasten unter der Leiste aus.
      -->
      <div class="nav-panel" id="nav-panel">
        <!-- data-view verbindet den Link mit der passenden Ansicht im <main> -->
        <ul class="reiter-gruppe reiter-gruppe--links">
          <li><a class="reiter" href="#kalender" data-view="kalender">Kalender</a></li>
          <li><a class="reiter" href="#games" data-view="games">Games</a></li>
          <li><a class="reiter" href="#media" data-view="media">Filme/Serien</a></li>
        </ul>

        <a class="reiter marke marke--desktop" href="#home" data-view="home">NTB</a>

        <ul class="reiter-gruppe reiter-gruppe--rechts">
          <li><a class="reiter" href="#schedule" data-view="schedule">Stundenplan/Termine</a></li>
          <li><a class="reiter" href="#einstellungen" data-view="einstellungen">Einstellungen</a></li>
          <li><a class="reiter" href="#customising" data-view="customising">Customising</a></li>
        </ul>
      </div>

      <!-- Dark-Mode-Schalter ganz rechts -->
      <button class="icon-button theme-schalter" id="theme-button" type="button"
              aria-label="Dunkles Design" aria-pressed="false">
        <!-- Das Symbol wird von app.js gesetzt (☾ oder ☀) -->
        <span id="theme-symbol" aria-hidden="true">☾</span>
      </button>

    </nav>
  </header>

  <!-- Hauptbereich: hier liegen alle Ansichten. Nur eine ist sichtbar,
       die anderen haben das Attribut "hidden". -->
  <main class="hauptbereich" id="main">

    <section class="ansicht" id="view-home" aria-labelledby="titel-home">
      <!-- Die Begrüßung ("Guten Morgen" …) setzt home.js -->
      <h1 id="titel-home" class="home-gruss" tabindex="-1">Willkommen bei NTB</h1>
      <!-- home.js füllt diesen Container: Datum, "Heute" und Kacheln -->
      <div id="home-root"></div>
    </section>

    <section class="ansicht" id="view-kalender" aria-labelledby="titel-kalender" hidden>
      <h1 id="titel-kalender" tabindex="-1">Kalender</h1>
      <!-- calendar.js füllt diesen Container mit der Jahresübersicht -->
      <div id="calendar-root"></div>
    </section>

    <section class="ansicht" id="view-games" aria-labelledby="titel-games" hidden>
      <h1 id="titel-games" tabindex="-1">Games</h1>
      <!-- games.js füllt diesen Container mit der Spiele-Übersicht -->
      <div id="games-root"></div>
    </section>

    <section class="ansicht" id="view-media" aria-labelledby="titel-media" hidden>
      <h1 id="titel-media" tabindex="-1">Filme/Serien</h1>
      <!-- media.js füllt diesen Container (Übersicht und Kategorien) -->
      <div id="media-root"></div>
    </section>

    <section class="ansicht" id="view-schedule" aria-labelledby="titel-schedule" hidden>
      <h1 id="titel-schedule" tabindex="-1">Stundenplan/Termine</h1>
      <!-- schedule.js füllt diesen Container mit der Wochenansicht -->
      <div id="schedule-root"></div>
    </section>

    <section class="ansicht" id="view-einstellungen" aria-labelledby="titel-einstellungen" hidden>
      <h1 id="titel-einstellungen" tabindex="-1">Einstellungen</h1>
      <!-- settings.js füllt diesen Container (u. a. Sicherung aller Daten) -->
      <div id="settings-root"></div>
    </section>

    <section class="ansicht" id="view-customising" aria-labelledby="titel-customising" hidden>
      <h1 id="titel-customising" tabindex="-1">Customising</h1>
      <!-- customising.js füllt diesen Container später -->
      <div class="karte" id="customising-root"></div>
    </section>

  </main>

  <!--
    Die Skripte stehen am Ende des <body>, damit das HTML schon geladen ist,
    wenn sie laufen. Reihenfolge: zuerst die Tools, zuletzt app.js,
    weil app.js die init-Funktionen der Tools aufruft.
    Bewusst KEIN type="module": Module funktionieren nicht, wenn man
    index.html per Doppelklick (file://) öffnet.
  -->
  <!-- Termine: der Store zuerst – Kalender und Stundenplan lesen beide daraus -->
  <script src="js/events-store.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/schedule.js"></script>
  <!-- Sudoku: erst die Logik, dann die Effekte, dann die Oberfläche,
       dann die Games-Übersicht, die das Sudoku startet -->
  <script src="js/sudoku-engine.js"></script>
  <script src="js/sudoku-effects.js"></script>
  <!-- Sudoku-Abenteuer: Regeln, Pixel-Figuren, Schadensaufbau, Kampffenster -->
  <script src="js/sudoku-rpg.js"></script>
  <script src="js/sudoku-sprites.js"></script>
  <script src="js/sudoku-damage-fx.js"></script>
  <script src="js/sudoku-battle-ui.js"></script>
  <script src="js/sudoku-ui.js"></script>
  <script src="js/games.js"></script>
  <!-- Filme/Serien: erst die Speicherung, dann die Darstellung -->
  <script src="js/media-store.js"></script>
  <script src="js/media.js"></script>
  <!-- Einstellungen: braucht MediaStore und EventsStore (für die Sicherung) -->
  <script src="js/settings.js"></script>
  <!-- Startseite: liest aus allen Stores, deshalb zuletzt vor app.js -->
  <script src="js/home.js"></script>
  <script src="js/customising.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
